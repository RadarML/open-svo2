[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-svo2-viewer"
version = "0.1.0"
description = "Minimal tkinter viewer for SVO2 files, built on open-svo2."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "open-svo2",
]

[project.scripts]
svo2-viewer = "open_svo2_viewer.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.uv.sources]
open-svo2 = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
